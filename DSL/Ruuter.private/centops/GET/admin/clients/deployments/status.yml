declaration:
  call: declare
  version: 0.1
  description: "Get deployment status for a specific client"
  method: get
  accepts: json
  returns: json
  namespace: centops
  allowlist:
    headers:
      - field: X-Vault-Token
        type: string
        description: "Vault authentication token"
    params:
      - field: appName
        type: string
        description: "The name of the Argo CD application to deploy"

check_for_required_parameters:
  switch:
    - condition: ${incoming.params.appName == null  || (incoming.headers != null && Object.keys(incoming.headers).find(h => h.toLowerCase() === 'x-vault-token') == null)}
      next: return_incorrect_request
  next: extract_request_data

extract_request_data:
  assign:
    appName: ${incoming.params.appName}
    vault_token: ${incoming.headers[Object.keys(incoming.headers).find(h => h.toLowerCase() === 'x-vault-token')]}
  next: get_secret_from_vault

get_secret_from_vault:
  call: http.get
  args:
    url: "[#VAULT_ADDR]/v1/secret/deployments/argocd"
    headers:
      X-Vault-Token: ${vault_token}
  result: vault_result
  next: check_vault_response

check_vault_response:
  switch:
    - condition: ${vault_result != null && vault_result.response != null && 200 <= vault_result.response.statusCodeValue && vault_result.response.statusCodeValue < 300 && vault_result.response.body.data.ARGO_CD_TOKEN != null}
      next: extract_vault_data
  next: return_vault_error

extract_vault_data:
  assign:
    argocd_token: ${vault_result.response.body.data.ARGO_CD_TOKEN}
  next: query_deployment_status

#### 2nd step - request to the ARGO CD
query_deployment_status:
  call: http.get
  args:
    url: "[#ARGO_CD_SERVER]/api/v1/applications/${appName}"
    headers:
      Authorization: "Bearer ${argocd_token}"
      Content-Type: application/json
  result: deployment_result
  next: check_response

check_response:
  switch:
    - condition: ${deployment_result != null && deployment_result.response != null && deployment_result.response.statusCodeValue >= 200 && deployment_result.response.statusCodeValue < 300}
      next: return_success
  next: return_error

return_success:
  wrapper: false
  return: ${deployment_result.response.body}
  next: end

return_incorrect_request:
  status: 400
  return: "Required parameter missing: client_id"
  next: end

return_vault_error:
  assign:
    has_response: ${vault_result != null && vault_result.response != null}
    has_body: ${has_response && vault_result.response.body != null}
    status_code: "${has_response ? vault_result.response.statusCodeValue : 500}"
    error_message: "${has_body ? vault_result.response.body.errors : ['Couldn't received data from Vault']}"
  status: ${status_code}
  return: ${error_message}
  next: end

return_error:
  assign:
    has_response: ${deployment_result != null && deployment_result.response != null}
    has_body: ${has_response && deployment_result.response.body != null}
    status_code: "${has_response ? deployment_result.response.statusCodeValue : 500}"
    error_message: "${has_body ? deployment_result.response.body.error : ['Internal server error']}"
  status: ${status_code}
  return: ${error_message}
  next: end
