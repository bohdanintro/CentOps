name: Lint, Format, Build, Check Version

on:
  push:
    #branches: ["test", "stage", "main"]
    branches: ["github-action-build"]
  workflow_dispatch:

env:
  BRANCH: ${{ github.head_ref || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
            fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: "[GUI Private] Run ESLint"
        run: |
          cd GUI.private
          npm run lint
        continue-on-error: true

      - name: "[GUI Private] Check Prettier formatting"
        run: |
          cd GUI.private
          npm run format
        continue-on-error: true

      - name: "[GUI Private] Build the project"
        run: |
          cd GUI.private
          npm run build

      - name: Bump Patch Version
        if: ${{ env.BRANCH == 'test' }}
        run: npm run bump-patch

      - name: Sync Version
        if: ${{ env.BRANCH != 'test' }}
        run: npm run sync-version

      - name: Generate Changelog
        if: ${{ env.BRANCH == 'main' }}
        run: npm run changelog

      - name: Push changes to repo
        run: |
          git config --global user.name "${{ secrets.ADMIN_NAME }}"
          git config --global user.email "${{ secrets.ADMIN_EMAIL }}"
          git add .
          git commit -m "docs: update version [skip ci]"
          git push

      - name: Load environment variables
        run: |
          awk -v branch="${{ env.BRANCH }}" ' /^[0-9a-zA-Z]+$/ { current_branch = $0; } current_branch == branch && /^[A-Z_]+=/{ print $0; }' release.env >> $GITHUB_ENV

      - name: Create Release
        if: ${{ env.BRANCH == 'main' }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.MAJOR }}.${{ env.MINOR }}.${{ env.PATCH }}
          generate_release_notes: true
          body_path: ${{ github.workspace }}/CHANGELOG.md